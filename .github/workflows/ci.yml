name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: npm

      # runner.temp is a step-level expression; exporting it here avoids the
      # invalid job-level context that previously broke workflow evaluation.
      - name: Configure isolated data directory
        run: echo "SHEET_DELVER_DATA=${{ runner.temp }}/sheet-delver-data" >> "$GITHUB_ENV"

      - name: Install reviewed dependency graph
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Generate isolated build fixture
        run: npm run ci:fixture

      - name: Build
        run: npm run build

      - name: Generate production SBOM
        run: npm sbom --omit=dev --sbom-format cyclonedx > "${{ runner.temp }}/sheet-delver.cdx.json"

      - name: Upload production SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sheet-delver-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/sheet-delver.cdx.json
          if-no-files-found: error
          retention-days: 14

  # GitHub supports dependency review for public repositories and private
  # organization repositories with GitHub Advanced Security. Enable this job
  # with the repository variable once that service is available.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
